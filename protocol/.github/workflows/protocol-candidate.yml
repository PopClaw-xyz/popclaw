name: Protocol candidate conformance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'TOOLCHAIN.json'
      - 'CONTRACT-MANIFEST.json'
      - '.github/workflows/protocol-candidate.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '25.9.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@9.12.0
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          curl --fail --location --retry 3 --output /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip
          echo 'af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904  /tmp/protoc.zip' | sha256sum --check
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo '/tmp/protoc/bin' >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m venv .venv
          .venv/bin/pip install -r packages/contracts/python/requirements.txt
      - name: Verify file integrity, build and cross-language conformance
        run: |
          python scripts/verify-bundle.py
          pnpm test
          cargo test --locked --workspace
          .venv/bin/python -m unittest discover -s packages/contracts/python -v
          python scripts/check-generated.py
          python scripts/verify-bundle.py
