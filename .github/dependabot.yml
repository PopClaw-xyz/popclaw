version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eslint-toolchain:
        patterns:
          - eslint
          - '@eslint/js'
          - typescript-eslint
    ignore:
      # Types follow the oldest supported Node runtime; minor/patch updates continue.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
# The sealed protocol/ workspace is upgraded as a reviewed bundle.
# packages/popclaw-mcp pins popclaw to the release version; update it with the
# main package via the release process, not an independent dependency PR.
