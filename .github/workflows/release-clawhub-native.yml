# Independent native-only release. OIDC is the default; explicit bootstrap-token
# creates the five real package names before binding THIS filename / npm-release.
# The ClawHub main archive is retained for review/upload, never npm-published here.
name: Release ClawHub native packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact full release tag, e.g. v0.1.3"
        required: true
        type: string
      source_run_id:
        description: "release.yml run with retained full archives and a successful package smoke"
        required: true
        type: string
      expected_source_commit:
        description: "Full 40-character commit: must equal both the tag target and source run head"
        required: true
        type: string
      expected_full_sha256:
        description: "Fixed lowercase SHA-256 of the retained full popclaw tarball"
        required: true
        type: string
      dry_run:
        description: "Verify, smoke, retain and npm publish --dry-run; zero real publication"
        required: true
        type: boolean
        default: true
      auth_mode:
        description: "OIDC normally; bootstrap-token only for the five real packages' first publication"
        required: true
        type: choice
        options:
          - oidc
          - bootstrap-token
        default: oidc
      resume_from_run_id:
        description: "Prior run of THIS workflow; reuse its exact six retained archives without repacking"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-clawhub-native-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.16.0"
  NODE_NEW_VERSION: "26.1.0"
  NPM_VERSION: "11.19.1"
  TAG: ${{ inputs.tag }}
  SOURCE_RUN: ${{ inputs.source_run_id }}
  SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
  FULL_SHA256: ${{ inputs.expected_full_sha256 }}
  RESUME_RUN: ${{ inputs.resume_from_run_id }}

jobs:
  prepare:
    name: prepare and retain
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      # Use the reviewed workflow revision's verifier/builder. The independently
      # verified source archive identity is recorded separately in the receipt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Remember Node 24 executable
        run: echo "NODE_24=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_NEW_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        if: inputs.resume_from_run_id == ''
        with:
          just-version: "1.49.0"
      - name: Pin npm for publication request checks
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Resolve source and retained run identities
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-retained-clawhub.py resolve \
            --tag "$TAG" --source-run-id "$SOURCE_RUN" --commit "$SOURCE_COMMIT" \
            --full-sha256 "$FULL_SHA256" --resume-from-run-id "$RESUME_RUN" \
            --output "$RUNNER_TEMP/context.json" --github-output "$GITHUB_OUTPUT"
      - name: Download the fixed full release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.source_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/full
          merge-multiple: true
      - name: Verify fixed full source bytes and native matrix
        id: full
        run: |
          python3 scripts/verify-retained-clawhub.py full \
            --directory "$RUNNER_TEMP/full" --context "$RUNNER_TEMP/context.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download retained ClawHub bytes without repacking
        if: inputs.resume_from_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.resume_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_from_run_id }}
          path: ${{ runner.temp }}/clawhub
          merge-multiple: true
      - name: Derive six archives from the fixed full source
        if: inputs.resume_from_run_id == ''
        env:
          FULL_TARBALL: ${{ steps.full.outputs.full_tarball }}
        run: |
          set -euo pipefail
          just pack-plugin clawhub "$FULL_TARBALL" "$RUNNER_TEMP/derived"
          derived="$RUNNER_TEMP/derived/popclaw-clawhub-${TAG#v}-${FULL_SHA256:0:12}"
          mkdir "$RUNNER_TEMP/clawhub"
          cp "$derived/"*.tgz "$derived/receipt.json" "$RUNNER_TEMP/clawhub/"
      - name: Verify and smoke retained ClawHub bytes
        env:
          FULL_TARBALL: ${{ steps.full.outputs.full_tarball }}
        run: |
          set -euo pipefail
          python3 scripts/verify-retained-clawhub.py verify \
            --directory "$RUNNER_TEMP/clawhub" --full-tarball "$FULL_TARBALL" \
            --context "$RUNNER_TEMP/context.json" --node "$NODE_24" --node "$(command -v node)" \
            --output "$RUNNER_TEMP/clawhub/validation.json"
          cp "$RUNNER_TEMP/context.json" "$RUNNER_TEMP/clawhub/release-context.json"
      - name: Retain ClawHub release bytes
        id: retain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-native-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/clawhub/*.tgz
            ${{ runner.temp }}/clawhub/receipt.json
            ${{ runner.temp }}/clawhub/release-context.json
            ${{ runner.temp }}/clawhub/validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Check registry names and publication requests without publishing
        if: inputs.dry_run
        env:
          AUTH_MODE: ${{ inputs.auth_mode }}
          # setup-node exports a placeholder; dry runs must receive no credential.
          NODE_AUTH_TOKEN: ""
        run: |
          node scripts/publish-clawhub-native.mjs --directory "$RUNNER_TEMP/clawhub" \
            --output "$RUNNER_TEMP/dry-run-result.json" --dry-run --auth-mode "$AUTH_MODE"

  publish-native:
    name: publish only verified native archives
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: macos-15
    # Five sequential scan windows of 15 minutes, plus setup and verification.
    timeout-minutes: 95
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Remember Node 24 executable
        run: echo "NODE_24=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_NEW_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin OIDC-capable npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Recheck source identity before publication
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-retained-clawhub.py resolve \
            --tag "$TAG" --source-run-id "$SOURCE_RUN" --commit "$SOURCE_COMMIT" \
            --full-sha256 "$FULL_SHA256" --resume-from-run-id "$RESUME_RUN" \
            --output "$RUNNER_TEMP/context.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.source_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/full
          merge-multiple: true
      - name: Verify full source again
        id: full
        run: |
          python3 scripts/verify-retained-clawhub.py full \
            --directory "$RUNNER_TEMP/full" --context "$RUNNER_TEMP/context.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download this run's tested retained bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/clawhub
          merge-multiple: true
      - name: Reverify and smoke the exact bytes to publish
        env:
          FULL_TARBALL: ${{ steps.full.outputs.full_tarball }}
        run: |
          python3 scripts/verify-retained-clawhub.py verify \
            --directory "$RUNNER_TEMP/clawhub" --full-tarball "$FULL_TARBALL" \
            --context "$RUNNER_TEMP/context.json" --node "$NODE_24" --node "$(command -v node)" \
            --output "$RUNNER_TEMP/clawhub/validation.json"
      - name: Preflight all five names, publish missing native versions, verify each
        env:
          # npm accepts uploads before publish-time scanning makes them readable.
          REGISTRY_POLL_ATTEMPTS: "91"
          REGISTRY_POLL_SLEEP: "10"
          AUTH_MODE: ${{ inputs.auth_mode }}
          NODE_AUTH_TOKEN: ""
          # This environment secret is available only to the final publish step.
          # The publisher forwards it only to real npm publish child processes.
          NPM_BOOTSTRAP_TOKEN: ${{ inputs.auth_mode == 'bootstrap-token' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: |
          node scripts/publish-clawhub-native.mjs --directory "$RUNNER_TEMP/clawhub" \
            --output "$RUNNER_TEMP/publish-result.json" --publish --auth-mode "$AUTH_MODE"

  attest-main:
    name: attest verified ClawHub archive and source evidence
    needs: [prepare, publish-native]
    if: ${{ !inputs.dry_run }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve fixed source identity before attestation
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-retained-clawhub.py resolve \
            --tag "$TAG" --source-run-id "$SOURCE_RUN" --commit "$SOURCE_COMMIT" \
            --full-sha256 "$FULL_SHA256" --resume-from-run-id "$RESUME_RUN" \
            --output "$RUNNER_TEMP/context.json" --github-output "$GITHUB_OUTPUT"
      - name: Download fixed full source for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.source_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/full
          merge-multiple: true
      - name: Verify full source before attestation
        id: full
        run: |
          python3 scripts/verify-retained-clawhub.py full \
            --directory "$RUNNER_TEMP/full" --context "$RUNNER_TEMP/context.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download the exact tested ClawHub artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/clawhub
          merge-multiple: true
      - name: Verify source preservation and prepare exact attestation subjects
        env:
          FULL_TARBALL: ${{ steps.full.outputs.full_tarball }}
        run: |
          python3 scripts/verify-retained-clawhub.py attestation \
            --directory "$RUNNER_TEMP/clawhub" --full-tarball "$FULL_TARBALL" \
            --context "$RUNNER_TEMP/context.json" --output "$RUNNER_TEMP/attestation-subjects.sha256"
      # This signs the verified archive and evidence in THIS workflow run.
      # The signed release context identifies the original full-source build.
      # Resumed bytes are verified and signed again, never rebuilt here.
      - name: Attest verified main archive and source evidence
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attestation-subjects.sha256
          create-storage-record: false
      - name: Retain the signed bundle and source evidence
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir "$RUNNER_TEMP/clawhub-attestation"
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/clawhub-attestation/bundle.json"
          cp "$RUNNER_TEMP/attestation-subjects.sha256" \
            "$RUNNER_TEMP/clawhub/receipt.json" "$RUNNER_TEMP/clawhub/release-context.json" \
            "$RUNNER_TEMP/clawhub-attestation/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-attestation-${{ inputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clawhub-attestation/
          if-no-files-found: error
          retention-days: 90
