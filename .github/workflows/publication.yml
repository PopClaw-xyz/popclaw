name: Publication checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Public content and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the content guard and the tracked public tree
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_publication.py' -v
          python3 -B scripts/check-publication.py
      - name: Install the checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scan_dir"
          curl --fail --show-error --silent --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          echo "$scan_dir" >> "$GITHUB_PATH"
      - name: Prove the scanner and fixture exceptions still detect new secrets
        run: python3 -B scripts/selfcheck-gitleaks.py --gitleaks gitleaks
      - name: Scan all fetched history with redacted output
        run: gitleaks git . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner
