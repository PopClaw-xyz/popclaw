# Fixed public test vectors, reviewed individually; never use these as live keys.
# Match the exact extracted value AND an exact known fixture path, only for
# generic-api-key. Other rules and other values in these files remain active.
# Keep default rules enabled; verify changes with scripts/selfcheck-gitleaks.py.
title = "PopClaw public fixture exceptions"

[extend]
useDefault = true

# Zero-pad UTF-8 tag seeds.house_a to 32 bytes; Ed25519 derive, base58 encode. Independently reproduced.
[[allowlists]]
description = "relation_house_a"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^5fwyfpnobtTSxd6v3Mo7r991QfqX9sQ2rBJWL6ai2TSn$''']
paths = [
  '''^apps/popclaw\-plugin/tests/fixtures/relation\-read\-v2\-vectors\.json$''',
  '''^protocol/packages/contracts/fixtures/relation\-read\-v2\-vectors\.json$''',
]

# Zero-pad UTF-8 tag seeds.house_b to 32 bytes; Ed25519 derive, base58 encode. Independently reproduced.
[[allowlists]]
